<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 210 420" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="fh-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="0.5" stop-color="#26262a"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <g id="fh-bulb">
      <path d="M-3 4.500v-2a6 6 0 1 1 6 0v2z" stroke="#e8e8e8" stroke-width="1.6"/>
      <path d="M-2.5 7.500h5" stroke="#e8e8e8" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- body -->
  <rect x="4" y="4" width="172" height="412" rx="34" fill="#0b0b0c"/>
  <rect x="8" y="8" width="164" height="404" rx="30" fill="url(#fh-body)"/>

  <g data-button="power">
    <title>Power</title>
    <circle cx="42" cy="46" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <path d="M37 41.500a7 7 0 1 0 10 0M42 38v8" stroke="#e8e8e8" stroke-width="1.8"/>
  </g>
  <g data-button="timer">
    <title>Timer</title>
    <circle cx="138" cy="46" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <circle cx="138" cy="46" r="8" stroke="#e8e8e8" stroke-width="1.6"/>
    <path d="M138 41v5l3.5 2" stroke="#e8e8e8" stroke-width="1.6"/>
  </g>
  <g data-button="mode">
    <title>Mode</title>
    <circle cx="42" cy="98" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <text x="42" y="105" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="19" fill="#e8e8e8" stroke="none">M</text>
  </g>
  <g data-button="fan_mode">
    <title>Oscillation</title>
    <circle cx="138" cy="98" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <g fill="#e8e8e8" stroke="none">
      <ellipse cx="138" cy="90" rx="2.5" ry="3.3"/>
      <ellipse cx="138" cy="90" rx="2.5" ry="3.3" transform="rotate(120 138 94)"/>
      <ellipse cx="138" cy="90" rx="2.5" ry="3.3" transform="rotate(240 138 94)"/>
      <circle cx="138" cy="94" r="1.4"/>
    </g>
    <path d="M130.5 106h15M133.5 103.5l-3 2.5 3 2.5M142.5 103.5l3 2.5-3 2.5" stroke="#e8e8e8" stroke-width="1.5"/>
  </g>

  <!-- control ring -->
  <circle cx="90" cy="196" r="64" fill="#2c2c30" stroke="#3c3c40" stroke-width="1.5"/>
  <g data-button="plus">
    <title>Plus</title>
    <path d="M52 164a50 50 0 0 1 76 0l-18 14a27 27 0 0 0-40 0z" fill="transparent" stroke="none"/>
    <path d="M81 150h18M90 141v18" stroke="#e8e8e8" stroke-width="2.2"/>
  </g>
  <g data-button="minus">
    <title>Minus</title>
    <path d="M52 228a50 50 0 0 0 76 0l-18-14a27 27 0 0 1-40 0z" fill="transparent" stroke="none"/>
    <path d="M81 242h18" stroke="#e8e8e8" stroke-width="2.2"/>
  </g>
  <g data-button="fan">
    <title>Fan</title>
    <path d="M58 158a50 50 0 0 0 0 76l14-18a27 27 0 0 1 0-40z" fill="transparent" stroke="none"/>
    <g fill="#e8e8e8" stroke="none">
      <path d="M46 195c-5-3-6-10 0-12 4 2 4 7 2 11z"/>
      <path d="M46 195c-5-3-6-10 0-12 4 2 4 7 2 11z" transform="rotate(120 46 196)"/>
      <path d="M46 195c-5-3-6-10 0-12 4 2 4 7 2 11z" transform="rotate(240 46 196)"/>
      <circle cx="46" cy="196" r="1.8"/>
    </g>
  </g>
  <g data-button="heat">
    <title>Heat</title>
    <path d="M122 158a50 50 0 0 1 0 76l-14-18a27 27 0 0 0 0-40z" fill="transparent" stroke="none"/>
    <path d="M134 185c5 4 8 8 8 13a8 8 0 0 1-16 0c0-3 1-5 3-7 1 2 2 3 3 3 0-3 0-6 2-9z" stroke="#e8e8e8" stroke-width="1.7"/>
  </g>
  <g data-button="temperature">
    <title>Temperature</title>
    <circle cx="90" cy="196" r="23" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <path d="M84 199v-12a3 3 0 0 1 6 0v12a5.5 5.5 0 1 1-6 0z" stroke="#e8e8e8" stroke-width="1.6"/>
    <circle cx="87" cy="203.5" r="2.2" fill="#e8e8e8"/>
    <path d="M87 203v-9" stroke="#e8e8e8" stroke-width="1.6"/>
    <path d="M95 189h6M98 186v6M95 200h6" stroke="#e8e8e8" stroke-width="1.6"/>
  </g>

  <g data-button="dimmer">
    <title>Light brightness</title>
    <circle cx="42" cy="294" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <use href="#fh-bulb" transform="translate(42 287) scale(0.7)"/>
    <path d="M32 302h20v-5z" fill="#e8e8e8"/>
  </g>
  <g data-button="light">
    <title>Light</title>
    <circle cx="138" cy="294" r="16" fill="#1b1b1e" stroke="#d8d8d8" stroke-width="1.8"/>
    <use href="#fh-bulb" transform="translate(138 296) scale(0.85)"/>
    <path d="M138 284v-2M130 287l-1.5-1.500M146 287l1.5-1.500M128 294h-2M148 294h2" stroke="#e8e8e8" stroke-width="1.4"/>
  </g>
</svg>
